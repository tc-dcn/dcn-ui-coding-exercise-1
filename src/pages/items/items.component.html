<h2>Items</h2>

<input
        type="text"
        placeholder="Filter by name"
        [(ngModel)]="filter"
/>

<ul>
    <li *ngFor="let item of items$ | async">
        <a [routerLink]="['/items', item.id]">
            {{ item.name }} - {{ item.category }}
            <span *ngIf="!item.inStock" class="out-of-stock">(Out of Stock)</span>
        </a>
    </li>
</ul>
